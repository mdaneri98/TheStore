apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: the-store
        orgId: 1
        folder: The Store
        type: file
        disableDeletion: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
