apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Prometheus itself
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

      # Node Exporter - hardware/OS metrics
      - job_name: node-exporter
        static_configs:
          - targets: [node-exporter.monitoring.svc.cluster.local:9100]
